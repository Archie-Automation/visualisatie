# Same compile the NUC Docker image runs. Fail here, not after 15 min on the NUC.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# PRs: cancel superseded runs. Main: never cancel — otherwise android-apk
# (10–15 min) is killed by the next version bump and tablets hang forever on
# "wacht tot het installatiebestand klaarstaat" while the server is already newer.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flutter-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release web build (docker/Dockerfile)
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r')"
          flutter build web --release \
            --dart-define=API_BASE= \
            --dart-define=APP_VERSION="$VERSION" \
            --pwa-strategy=none

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Same pubspec version as the server. APK is a GitHub Release asset, not a git blob.
  android-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flutter-web, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Android-keystore secrets ontbreken. Verwacht ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/sideload.jks
          python3 - << 'PY'
          import os, pathlib, sys
          p = pathlib.Path("android/sideload.jks")
          data = p.read_bytes()
          pkcs12 = len(data) > 4 and data[0] == 0x30 and data[1] == 0x82
          jks = data.startswith(b"\xfe\xed\xfe\xed")
          if not (pkcs12 or jks):
              sys.exit("ANDROID_KEYSTORE_BASE64 is geen keystore. Plak de klembordtekst opnieuw, zonder extra tekst eromheen.")
          pathlib.Path("android/key.properties").write_text(
              "storePassword=" + os.environ["ANDROID_STORE_PASSWORD"] + "\n"
              "keyPassword=" + os.environ["ANDROID_KEY_PASSWORD"] + "\n"
              "keyAlias=" + os.environ["ANDROID_KEY_ALIAS"] + "\n"
              "storeFile=sideload.jks\n",
              encoding="utf-8",
          )
          PY
      - name: Release APK
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r')"
          test -n "$VERSION"
          flutter build apk --release \
            --dart-define=API_BASE= \
            --dart-define=APP_VERSION="$VERSION"
          CODE="${VERSION##*+}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$(ls -1 "$SDK"/build-tools/*/aapt 2>/dev/null | tail -1 || true)"
          if [ -n "$AAPT" ]; then
            BADGING="$("$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk)"
            echo "$BADGING" | grep -q "versionCode='$CODE'" || {
              echo "APK versionCode hoort $CODE te zijn (pubspec $VERSION)"
              echo "$BADGING" | head -n 5
              exit 1
            }
          fi
          APKSIGNER="$(ls -1 "$SDK"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner ontbreekt in de Android SDK"
            exit 1
          fi
          CERTS="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)" || {
            echo "apksigner kon de APK niet lezen"
            printf '%s\n' "$CERTS"
            exit 1
          }
          FP="$(printf '%s\n' "$CERTS" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -1 | tr -d '[:space:]:' | tr 'A-F' 'a-f')"
          EXPECT="e0b9abe90bc7309f530d1ffeddb674996e36724964604a11a7a55a08d57398da"
          if [ "$FP" != "$EXPECT" ]; then
            echo "APK is niet met het Archie-stempel getekend."
            echo "Gevonden: ${FP:-geen SHA-256}"
            printf '%s\n' "$CERTS"
            exit 1
          fi
      - name: Publish android-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | tr -d '\r')"
          cp app/build/app/outputs/flutter-apk/app-release.apk archie-os.apk
          NOTES="Server + tablet ${VERSION}. NUC: Server bijwerken. Tablet: Installeren."
          if gh release view android-latest >/dev/null 2>&1; then
            # Leftover app-release.apk (old debug builds) is picked first by
            # naive asset matching and tablets then "install" a downgrade.
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              case "$name" in
                archie-os.apk) ;;
                *.apk)
                  echo "Removing stale APK asset: $name"
                  gh release delete-asset android-latest "$name" --yes
                  ;;
              esac
            done < <(gh release view android-latest --json assets --jq '.assets[].name')
            gh release edit android-latest --title "$VERSION" --prerelease --notes "$NOTES"
            gh release upload android-latest archie-os.apk --clobber
          else
            gh release create android-latest archie-os.apk --prerelease --title "$VERSION" --notes "$NOTES"
          fi
          leftover="$(gh release view android-latest --json assets --jq '.assets[].name' | grep -E '\.apk$' | grep -v '^archie-os\.apk$' || true)"
          if [ -n "$leftover" ]; then
            echo "android-latest mag alleen archie-os.apk hebben, nog aanwezig:"
            echo "$leftover"
            exit 1
          fi
          gh release view android-latest --json assets --jq '.assets[].name' | grep -qx 'archie-os.apk'
