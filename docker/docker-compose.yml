# Eén stack: Flutter web UI + Archie OS API + go2rtc.
# Installatie:  ./install.sh
#
# Vereist: docker/.env (zie .env.example). Ontbrekende house.json wordt
# aangemaakt vanuit config/house.empty.json (bestaande config blijft onaangetast).

services:
  knx-stack:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: archie-os-stack:latest
    container_name: archie-os-stack
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=4000
      - CONFIG_PATH=/config/house.json
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-long-random-string}
      - LOG_LEVEL=info
      - KNX_SIMULATE=0
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-http://127.0.0.1:1984}
      - PUBLIC_API_BASE=${PUBLIC_API_BASE:-}
      - HTTPS_PORT=${HTTPS_PORT:-4443}
      - TLS_CERT_PATH=/data/certs/tls.crt
      - TLS_KEY_PATH=/data/certs/tls.key
      - SPOTIFY_OAUTH_BOUNCE=${SPOTIFY_OAUTH_BOUNCE:-}
      - WEB_ROOT=/app/web
      - GO2RTC_CONFIG_PATH=/media/go2rtc.yaml
      - GO2RTC_AUTO_START=1
      - LOG_STORE_PATH=/data/logs.db
      - HVAC_LOCK_STORE_PATH=/data/hvac-locks.json
      - SPOTIFY_STORE_PATH=/data/spotify.json
      - GITHUB_REPO=${GITHUB_REPO:-Archie-Automation/visualisatie}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      # Writable: installer saves house.json from the app.
      - ../config:/config
      - ./go2rtc:/media
      - ./data:/data
