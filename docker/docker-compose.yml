# Eén stack: Flutter web UI + Archie OS API + go2rtc.
# Installatie:  ./install.sh
#
# Vereist: docker/.env (zie .env.example). Ontbrekende house.json wordt
# aangemaakt vanuit config/house.empty.json (bestaande config blijft onaangetast).

services:
  knx-stack:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: archie-os-stack:latest
    container_name: archie-os-stack
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=4000
      - CONFIG_PATH=/config/house.json
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-long-random-string}
      - LOG_LEVEL=info
      - KNX_SIMULATE=0
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-http://127.0.0.1:1984}
      - PUBLIC_API_BASE=${PUBLIC_API_BASE:-}
      - HTTPS_PORT=${HTTPS_PORT:-4443}
      - TLS_CERT_PATH=/data/certs/tls.crt
      - TLS_KEY_PATH=/data/certs/tls.key
      - SPOTIFY_OAUTH_BOUNCE=${SPOTIFY_OAUTH_BOUNCE:-}
      - WEB_ROOT=/app/web
      - GO2RTC_CONFIG_PATH=/media/go2rtc.yaml
      - GO2RTC_AUTO_START=1
      - LOG_STORE_PATH=/data/logs.db
      - HVAC_LOCK_STORE_PATH=/data/hvac-locks.json
      - SPOTIFY_STORE_PATH=/data/spotify.json
      - SESSIONS_STORE_PATH=/data/sessions.json
      - PUSH_STORE_PATH=/data/push.json
      - PUSH_RELAY_URL=${PUSH_RELAY_URL:-}
      - FCM_CLIENT_CONFIG=${FCM_CLIENT_CONFIG:-}
      - ASTERISK_CONF_DIR=/data/asterisk
      - ASTERISK_AMI_HOST=127.0.0.1
      - ASTERISK_AUTO_START=1
      - GITHUB_REPO=${GITHUB_REPO:-Archie-Automation/visualisatie}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Remote toegang (Archie Cloud); leeg = alleen LAN.
      - SERVER_ID=${SERVER_ID:-}
      - REMOTE_URL=${REMOTE_URL:-}
      - WG_ADDRESS=${WG_ADDRESS:-}
      - TURN_HOST=${TURN_HOST:-}
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_TTL=${TURN_TTL:-3600}
      - GO2RTC_RELAY_CANDIDATE=${GO2RTC_RELAY_CANDIDATE:-}
    volumes:
      # Writable: installer saves house.json from the app.
      - ../config:/config
      - ./go2rtc:/media
      - ./data:/data
      # Alleen om de oude losse archie-os-asterisk-container op te ruimen.
      - /var/run/docker.sock:/var/run/docker.sock

  # Optioneel: KNXnet/IP-server voor ETS op afstand (via WireGuard).
  # Deelt de fysieke IP-interface; ETS verbindt met <WG_ADDRESS>:3671.
  # Starten:  docker compose --profile knxd up -d
  # Vereist KNX_GATEWAY_HOST in docker/.env (IP van de KNX IP-interface/router).
  knxd:
    image: ghcr.io/knxd/knxd:latest
    container_name: archie-os-knxd
    restart: unless-stopped
    profiles: ["knxd"]
    network_mode: host
    command: >
      knxd --eibaddr=0.0.1 --client-addrs=0.0.2:8
      --Discovery --Tunnelling --Server
      --listen-tcp=6720
      -b ipt:${KNX_GATEWAY_HOST:-192.168.1.10}:3671

