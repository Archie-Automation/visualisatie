<!DOCTYPE html>
<html lang="nl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Responsive viewport — CRITICAL for smartphones.
       overlays-content: Safari-chrome / toetsenbord mag de Flutter-view
       niet resizen (dat trilt de hele UI bij scrollen). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">

  <meta name="description" content="Archie OS Smart Home">

  <!-- PWA / iOS standalone -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Archie OS">

  <!-- Status bar color (Android Chrome) -->
  <meta name="theme-color" content="#B59144">

  <!-- Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>Archie OS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%;
      height: 100%;
      height: 100lvh;
      background: #F5F0E8;
      /* Pin the document so iOS Safari toolbar show/hide cannot rubber-band
         or resize the Flutter canvas mid-scroll. */
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
    flt-glass-pane, flt-scene, flt-scene-host, flutter-view {
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      touch-action: manipulation;
    }
    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F5F0E8;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #flutter-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes logoFlip {
      from { transform: perspective(400px) rotateY(-90deg); }
      to   { transform: perspective(400px) rotateY(90deg); }
    }
    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      overflow: hidden;
      background: #302b25;
      animation: logoFlip 1.5s ease-in-out infinite alternate;
    }
    .splash-logo img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <!-- HTML-niveau splash: zichtbaar vóórdat Flutter start -->
  <div id="flutter-loading">
    <div class="splash-logo">
      <img src="icons/Icon-192.png" alt="Archie OS">
    </div>
  </div>

  <script>
    // Before Flutter loads: turn history.pushState into replaceState so iOS
    // Safari edge-swipe cannot walk a stack of in-app routes.
    (function () {
      var replace = history.replaceState.bind(history);
      history.pushState = function (state, title, url) {
        return replace(state, title, url);
      };
    })();
  </script>
  <script src="jssip.min.js"></script>
  <script src="archie_sip.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Verberg de HTML-splash zodra Flutter het overneemt
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('flutter-loading');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
