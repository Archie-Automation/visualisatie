name: archie_os
description: Archie OS Smart Home client.
publish_to: "none"
version: 0.2.0+163

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  video_player: ^2.14.0
  flutter_webrtc: ^1.6.0
  sip_ua: ^1.1.0
  permission_handler: ^12.0.3
  flutter_callkit_incoming: ^3.1.5
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  fl_chart: ^1.0.0
  file_picker: ^12.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  dart_suncalc: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
