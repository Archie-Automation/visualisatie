name: luxe_knx
description: Luxe KNX Smart Home client.
publish_to: "none"
version: 0.2.0+32

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  video_player: ^2.9.1
  flutter_webrtc: ^1.2.0
  sip_ua: ^1.1.0
  permission_handler: ^12.0.3
  flutter_callkit_incoming: ^3.1.1
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  fl_chart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
